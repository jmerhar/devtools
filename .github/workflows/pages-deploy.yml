name: Pages deploy

# Builds a site and deploys it to GitHub Pages. The site's hidden files (.well-known/) are kept.
#
#   on:
#     push:
#       branches: [main]
#   jobs:
#     pages:
#       uses: jmerhar/devtools/.github/workflows/pages-deploy.yml@v1
#       with:
#         node: "24"
#         install: npm ci
#         build: npm run build
#         path: dist
#       permissions:
#         contents: read
#         pages: write
#         id-token: write
#
# The shared tooling is fetched before the build, so the build can use it; pages-artifact.sh,
# which archives the site, must be in devtools.toml's [fetch] files.
on:
  workflow_call:
    inputs:
      node:
        description: The Node version to set up, or empty for none.
        type: string
        default: ""
      python:
        description: The Python version to set up, or empty for none.
        type: string
        default: ""
      install:
        description: The command that installs what the build needs, if anything.
        type: string
        default: ""
      build:
        description: The command that builds the site.
        type: string
        required: true
      path:
        description: The directory the build writes the site to.
        type: string
        required: true
      tooling:
        description: Where the shared tooling is, relative to the repository root.
        type: string
        default: .devtools
      fetcher:
        description: The command that fetches the shared tooling.
        type: string
        default: bin/devtools-fetch.sh

permissions:
  contents: read

# One deployment at a time; a newer push waits for the one in progress rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: inputs.node != ''
        with:
          node-version: ${{ inputs.node }}

      - uses: actions/setup-python@v7
        if: inputs.python != ''
        with:
          python-version: ${{ inputs.python }}

      - name: Fetch the shared tooling
        run: ${{ inputs.fetcher }}

      - name: Install
        if: inputs.install != ''
        run: ${{ inputs.install }}

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: ${{ inputs.build }}

      - name: Archive the site
        env:
          SITE: ${{ inputs.path }}
        run: ${{ inputs.tooling }}/bin/pages-artifact.sh "$SITE" "$RUNNER_TEMP/artifact.tar"

      - uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
