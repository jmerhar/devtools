name: CI

on:
  # push is limited to main because pull_request already covers branch work; triggering on both
  # would run everything twice for every pull request.
  # Tags too, so the files a release tag serves are fetched and checked once it is pushed.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Read-only unless a job asks for more, so a compromised step cannot push to the repository.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: pip install -r requirements-dev.txt

      # ShellCheck is preinstalled on GitHub-hosted runners.
      - name: Lint
        env:
          RUFF: ruff
        run: tooling/lint.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: read for checkout; statuses: write to link the coverage report from the commit.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Python suite under coverage
        env:
          PYTHON: python
          JUNIT_DIR: junit
        run: tooling/coverage-python.sh

      # The bats suites under kcov, as the shell suite in coverage.toml declares. kcov has no
      # Ubuntu 24.04 package, so this takes the coverage repository's pinned container.
      - uses: jmerhar/coverage/.github/actions/kcov@v1
        with:
          junit-dir: junit

      - uses: jmerhar/coverage/.github/actions/summary@v1

      # Informational (see codecov.yml), and before the gate so the data lands even when the gate
      # fails.
      - uses: jmerhar/coverage/.github/actions/codecov@v1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          junit: junit/*.xml

      # Fails the build if a suite drops below its bound in coverage.toml.
      - uses: jmerhar/coverage/.github/actions/gate@v1

      # Only on green pushes to main; the action skips when the token is absent.
      - uses: jmerhar/coverage/.github/actions/publish@v1
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          token: ${{ secrets.COVERAGE_PAGES_TOKEN }}
          description: Shared build tooling coverage report

  smoke-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # A tag by its name, as a repository pins it; a pull request by its head commit rather than
      # GITHUB_SHA, its merge commit, which no branch holds.
      - name: Fetch this commit's files from GitHub
        env:
          REF: ${{ github.event.pull_request.head.sha || (github.ref_type == 'tag' && github.ref_name) || github.sha }}
        run: tooling/smoke-fetch.sh "$REF"
